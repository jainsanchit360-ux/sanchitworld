        <h1>Sanchit Jain &mdash; AI &amp; Data Science Portfolio</h1>
        <p>B.Tech student in Artificial Intelligence &amp; Data Science at Guru Ghasidas Vishwavidyalaya (GGV), Bilaspur, Chhattisgarh, India.</p>
        <p>I am a B.Tech student in Artificial Intelligence &amp; Data Science at Guru Ghasidas Vishwavidyalaya (GGV), a central university located in Bilaspur, Chhattisgarh. My interest in technology grew from a simple question &mdash; how can software solve problems that real people face every day? At GGV, I study core AI and Data Science subjects including machine learning, data structures and algorithms, database management systems, and statistical modelling. Beyond academics, I apply this learning through practical deployed projects. I also serve as the AWS Builder Leader at GGV, helping drive cloud computing awareness among the student developer community.</p>

        <h2>Projects</h2>

        <h3>ToolNagri &mdash; Free Online Tools Platform</h3>
        <p><a href="https://tools.sanchitworld.in/">https://tools.sanchitworld.in/</a></p>
        <p>ToolNagri is a free online utility hub built for Indian students and professionals who need practical tools without creating an account or paying a subscription. The platform provides 20+ tools across eight categories: Student Tools (SGPA, CGPA, Attendance calculators), Finance Tools (EMI, SIP, GST calculators), PDF &amp; Document Tools (convert, merge, compress, split PDFs), AI Tools, Calculators, Converters, Career Tools (Resume Builder), and Everyday Tools (QR Code Generator, Image Compressor). All document tools process files locally in the user&rsquo;s browser for privacy.</p>
        <ul>
          <li>20+ free tools across 8 categories &mdash; no account required</li>
          <li>PDF tools process files locally in-browser for user privacy</li>
          <li>Student-focused: SGPA, CGPA, attendance and marks calculators</li>
          <li>Career tools: ATS-friendly Resume Builder with PDF export</li>
          <li>Mobile-first design built for Indian internet conditions</li>
        </ul>
        <p><span class="tag">Vanilla JS</span> <span class="tag">HTML/CSS</span> <span class="tag">PDF Processing</span> <span class="tag">PWA</span></p>

        <h3>GGV Bazar &mdash; Student Campus Marketplace</h3>
        <p><a href="https://ggvbazar.sanchitworld.in/">https://ggvbazar.sanchitworld.in/</a></p>
        <p>GGV Bazar is a fully deployed student-to-student marketplace built specifically for Guru Ghasidas Vishwavidyalaya (GGV), Bilaspur. Students can list and discover pre-owned items across eight categories: Books &amp; Notes, Electronics, Cycles, Hostel &amp; Furniture, Stationery, Sports, Clothing, and Others. Built with Next.js App Router on the frontend and Supabase for authentication, database, and image storage &mdash; real listings from GGV students are live on the platform today.</p>
        <ul>
          <li>Live peer-to-peer marketplace with real GGV student listings</li>
          <li>8 item categories: Books, Electronics, Cycles, Hostel gear &amp; more</li>
          <li>Supabase-backed authentication, image storage, and real-time database</li>
          <li>Next.js App Router with server-side rendering and SEO metadata</li>
          <li>Search, category filters, favourites, and item listing creation</li>
        </ul>
        <p><span class="tag">Next.js</span> <span class="tag">Supabase</span> <span class="tag">Full-Stack</span> <span class="tag">PostgreSQL</span></p>

        <h3>GGV Campus Navigator &mdash; 3D Spatial Mapping</h3>
        <p>An interactive 3D campus navigation application for Guru Ghasidas Vishwavidyalaya that helps students and visitors explore the campus layout, locate buildings, and find walking routes between departments. Built using MapLibre GL JS for 3D building rendering and a FastAPI backend for route computation.</p>
        <p><span class="tag">React</span> <span class="tag">MapLibre GL 3D</span> <span class="tag">FastAPI</span> <span class="tag">Python</span></p>

        <h3>Medicine Stock Demand Predictor &mdash; Data Science &amp; Forecasting</h3>
        <p>A machine learning forecasting model that predicts pharmaceutical demand to help optimise inventory levels in healthcare settings. Uses time-series analysis and ensemble methods built with Python, Pandas, and Scikit-Learn to project future stock requirements and flag medicines at risk of stockout or expiration waste.</p>
        <p><span class="tag">Python</span> <span class="tag">Pandas</span> <span class="tag">Scikit-Learn</span> <span class="tag">Time-Series</span></p>

        <h3>SkillSwap (NeighborSync) &mdash; Automation &amp; Web Dev</h3>
        <p>A peer-to-peer skill bartering platform where users can offer and request services from their community without monetary exchange. The backend is powered by n8n automation workflows that handle skill-matching logic, notification routing, and Supabase database synchronisation.</p>
        <p><span class="tag">n8n</span> <span class="tag">Supabase</span> <span class="tag">React</span> <span class="tag">Automation</span></p>
